# Roda os testes do servidor e confere as telas a cada mudança (push/PR na main).
name: Testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  servidor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
  telas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: route-genius-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: route-genius-main/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npm run build
